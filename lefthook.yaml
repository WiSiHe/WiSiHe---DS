pre-commit:
  parallel: true
  commands:
    typecheck:
      glob: '*.{ts,tsx,js,jsx}'
      run: pnpm turbo typecheck
      fail_text: '❌ TypeScript type checking failed. Please fix the errors and try again.'

    build:
      glob: '*.{ts,tsx,js,jsx}'
      run: pnpm turbo build --filter=!sanity-studio
      fail_text: '❌ Build failed. Please fix the errors and try again.'

