pre-commit:
  parallel: true
  commands:
    typecheck:
      glob: '*.{ts,tsx,js,jsx}'
      run: pnpm turbo typecheck
      fail_text: '❌ TypeScript type checking failed. Please fix the errors and try again.'

    lint:
      glob: '*.{js,jsx,ts,tsx,svelte,vue}'
      run: pnpm turbo lint
      fail_text: '❌ Linting failed. Please fix the errors and try again.'
