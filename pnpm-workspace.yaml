packages:
  - 'apps/*'
  - 'packages/*'

overrides:
  '@types/node': 25.3.5

onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@vercel/speed-insights'
  - core-js
  - esbuild
  - lefthook
  - less
  - msw
  - protobufjs
  - sharp
  - unrs-resolver

peerDependencyRules:
  allowedVersions:
    react: '19'
    react-dom: '19'
    sanity: '6'
  ignoreMissing:
    - react
    - react-dom

allowedDeprecatedVersions:
  glob: 8.1.0
  inflight: '*'
  source-map: 0.8.0-beta.0

autoInstallPeers: true

publicHoistPattern:
  - '*storybook*'
  - '*lefthook*'
