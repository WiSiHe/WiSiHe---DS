overrides:
  '@types/node': '26.6.6'
  'js-yaml@<3.15.2': '5.5.0'
  'smol-toml@<1.9.0': '^1.9.0'
  'uuid@<11.1.1': '^14.0.3'
  'katex@<0.18.2': '^0.19.0'
  'vue@<3.5.43': '^3.5.43'
  '@vue/server-renderer@<3.5.43': '^3.5.43'
  vite@*: 'catalog:'
  vitest@*: 'catalog:'

packageExtensions:
  '@asamuzakjp/css-color':
    peerDependencies:
      '@csstools/css-calc': '*'

allowBuilds:
  less: true
  esbuild: true
  lefthook: true
  '@vercel/speed-insights': true
  core-js: true
  '@parcel/watcher': true
  protobufjs: true
  sharp: true
  unrs-resolver: true
  msw: true

peerDependencyRules:
  allowedVersions:
    react: '19'
    react-dom: '19'
    sanity: '6'
    typescript: '7'
    vite: '*'
    vitest: '*'
  ignoreMissing:
    - react
    - react-dom
  allowAny:
    - vite
    - vitest

allowedDeprecatedVersions:
  glob: '8.1.0'
  inflight: '*'
  source-map: '0.8.0-beta.0'

autoInstallPeers: true

publicHoistPattern:
  - '*storybook*'
  - '*lefthook*'
  - '*@csstools/*'
  - '*@asamuzakjp/*'
  - '*css-calc*'
