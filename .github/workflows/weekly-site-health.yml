name: Weekly site health

on:
  schedule:
    # Mondays 08:00 UTC
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  review:
    name: PostHog + Lighthouse + JSON-LD → GitHub issues
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.23.0

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v2

      - name: Run site-health review
        env:
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ secrets.POSTHOG_PROJECT_ID }}
          POSTHOG_API_HOST: ${{ vars.POSTHOG_API_HOST }}
          SITE_HEALTH_BASE_URL: ${{ vars.SITE_HEALTH_BASE_URL }}
          SITE_HEALTH_A11Y_MIN: ${{ vars.SITE_HEALTH_A11Y_MIN }}
          SITE_HEALTH_SEO_MIN: ${{ vars.SITE_HEALTH_SEO_MIN }}
          SITE_HEALTH_PERF_MIN: ${{ vars.SITE_HEALTH_PERF_MIN }}
          SITE_HEALTH_MAX_ISSUES: ${{ vars.SITE_HEALTH_MAX_ISSUES }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/weekly-site-health.mjs
